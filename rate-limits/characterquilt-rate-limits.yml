note: >-
  CharacterQuilt documents no rate limits and returns no rate-limit headers. An
  agent calling either surface has no runtime signal at all — no budget, no
  remaining count, no reset, and no Retry-After to obey if it is ever throttled.
  This is a measured zero, verified on the wire, not an unchecked field.
