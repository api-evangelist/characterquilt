openapi: 3.2.0
info:
  title: CharacterQuilt Brand Profiles Discovery API
  version: '1.0'
  description: Public, machine-readable brand-profiles data surface published by CharacterQuilt.
  contact:
    name: CharacterQuilt
    email: hello@characterquilt.com
    url: https://www.characterquilt.com
servers:
- url: https://www.characterquilt.com
  description: Production
tags:
- name: Discovery
paths:
  /llms.txt:
    get:
      operationId: getLlmsIndex
      summary: Get the llms.txt catalog of brand profiles
      description: Machine-readable llms.txt index listing every catalogued company and the link to its brand profile.
      tags:
      - Discovery
      responses:
        '200':
          description: llms.txt document.
          content:
            text/plain:
              schema:
                type: string
