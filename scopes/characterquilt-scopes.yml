gaps:
- issue: no-scope-reference-page
  detail: >-
    No public documentation maps these scopes to operations, so a client cannot
    determine least privilege for a given task. The scope strings are only
    discoverable by reading the protected-resource metadata.
- issue: authorization-server-metadata-missing
  detail: >-
    authorization_servers names https://characterquilt-review-beta.vercel.app — a
    Vercel preview deployment — and that host does NOT serve RFC 8414
    authorization-server metadata: both /.well-known/oauth-authorization-server and
    /.well-known/openid-configuration return HTTP 200 with the Next.js HTML app
    shell, not JSON. The OAuth discovery chain therefore terminates: an MCP client
    that follows the WWW-Authenticate resource_metadata pointer correctly cannot
    reach an authorization endpoint. Probed 2026-08-13.
