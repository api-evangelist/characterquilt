aid: characterquilt
name: CharacterQuilt
description: >-
  CharacterQuilt is an AI-native marketing infrastructure company (Y Combinator
  Spring 2026) building computer-use agents that design and deploy enterprise
  marketing campaigns end-to-end. Marketing teams submit a brief and CharacterQuilt's
  agents handle audience segmentation, on-brand creative generation, brand validation,
  and direct deployment into existing tools such as HubSpot, Marketo, WordPress, and
  LinkedIn — collapsing work that once took multiple agencies, ten tools, and six weeks
  into roughly an hour. Alongside the product, CharacterQuilt publishes a public,
  machine-readable brand-profiles data surface at /branding/<slug>.json: colors,
  typography, logos, components, and personality extracted from thousands of companies'
  live websites, intended for agents, designers, and AI tools. Founded by Bhairav Mehta
  (CEO) and Clint Burgess and based in San Francisco.
