- aid: characterquilt:characterquilt-mcp-server
  name: CharacterQuilt MCP Server
  description: >-
    CharacterQuilt's hosted Model Context Protocol server, the agent-facing surface
    of its marketing agent runtime. Live and OAuth-protected at
    https://mcp.characterquilt.com/api/mcp: an anonymous request returns HTTP 401
    with a spec-correct RFC 9728 challenge pointing at published protected-resource
    metadata, which declares bearer-header auth and five scopes —
    read:design_brain, write:generated_artifacts, publish:public_file,
    read:agent_work and write:agent_work. The tool list is auth-gated, so no tool
    names are recorded. CharacterQuilt publishes no documentation for this surface;
    it was found by DNS enumeration and confirmed by the server's own metadata and
    by the company's engineering job posting, which names "the API, CLI, and MCP
    surfaces around our agent runtime".
  humanURL: https://www.characterquilt.com
  baseURL: https://mcp.characterquilt.com
  tags:
  - MCP
  - AI Agents
  - Marketing Automation
