method: probed
source: >-
  live probes 2026-08-13 of https://mcp.characterquilt.com/api/mcp,
  https://mcp.characterquilt.com/.well-known/oauth-protected-resource,
  https://characterquilt-review-beta.vercel.app/.well-known/*,
