tools_note: >-
  Anonymous POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} with Accept:
  application/json, text/event-stream returns HTTP 401 {"error":"unauthorized"}.
  The same for initialize. Real tool names and inputSchemas require an
  authenticated introspection, which we do not have. The five OAuth scopes are the
  only published description of what the server can do: they imply read access to a
  per-customer brand model ("design brain"), read/write on agent runs, write on
  generated creative artifacts, and a publish verb with an externally visible
  consequence.
