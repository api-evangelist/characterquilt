note: >-
  CharacterQuilt runs a REAL hosted MCP server. It was missed on the first
  enrichment round because nothing on www.characterquilt.com links to it and the
  company publishes no developer portal — the mcp.characterquilt.com subdomain was
  found by DNS enumeration, then confirmed by the server's own RFC 9728
  protected-resource metadata, which names the endpoint and its OAuth scopes.
  CharacterQuilt's YC engineering job posting independently describes "the API, CLI,
  and MCP surfaces around our agent runtime". The tool list is OAuth-gated and is
  therefore NOT recorded here — no tool names are invented.
